<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>\ @Home \</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/png/128x128.png" />
    <link rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/png/16x16.png"
    />
    <link rel="icon"
      type="image/png"
      sizes="48x48"
      href="./assets/png/48x48.png"
    />
    <link rel="shortcut icon"
      href="./assets/svg/b2ntp_logo.svg"
      type="image/x-icon"
    />
  </head>

  <body>
    <!-- #include partials/changelog.html -->
    <div id="background_overlay">
      <div id="background-light"></div>
      <div id="background-dark"></div>
    </div>

    <!-- ------------- Context Menu -------------- -->
    <div class="context" hidden>
      <div class="context_item">
        <div class="inner_item">Copy Link</div>
      </div>
      <div class="context_hr"></div>
      <div class="context_item">
        <div class="inner_item">Add New</div>
      </div>
      <div class="context_item">
        <div class="inner_item">Delete</div>
      </div>
    </div>
    <!-- ------------- Toast Message ------------- -->
    <div class="toast toast-top toast-center" id="nt1" toast-pos="top" popover="manual"></div>
    <!-- --------------- Main NTP ---------------- -->
    <div class="workspace">
      <!-- --------- LeftSidebar Widgets ----------- -->
      <aside id="tabs"></aside>
      <!---- Toolbar, Search Bar, Bookrmarks ---->
      <main>
        <!-- --------- Toolbar (region chrome, part of no widget) ---------- -->
        <div class="toolbar">
          <div class="clock_date">
            <span id="clock">18:06:20</span>
            <span id="date">01/01/2024</span>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg"
            id="open-options"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-settings-2"
            style="cursor: pointer"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M19.875 6.27a2.225 2.225 0 0 1 1.125 1.948v7.284c0 .809 -.443 1.555 -1.158 1.948l-6.75 4.27a2.269 2.269 0 0 1 -2.184 0l-6.75 -4.27a2.225 2.225 0 0 1 -1.158 -1.948v-7.285c0 -.809 .443 -1.554 1.158 -1.947l6.75 -3.98a2.33 2.33 0 0 1 2.25 0l6.75 3.98h-.033z"
            />
            <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          </svg>
        </div>
        <!-- --------- Search + Bookmarks widgets (main.header + main.body) ---------- -->
        <div id="main-widgets"></div>
      </main>
      <!-- --------- Right Sidebar Widgets --------- -->
      <aside id="right-sidebar"></aside>
    </div>
    <!-- #include partials/gotop.html -->
    <script type="module" src="./js/blank.js"></script>
  </body>
</html>
