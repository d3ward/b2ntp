<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>b2ntp — Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/png/128x128.png" />
    <link rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/png/16x16.png"
    />
    <link rel="icon"
      type="image/png"
      sizes="48x48"
      href="./assets/png/48x48.png"
    />
    <link rel="shortcut icon"
      href="./assets/svg/b2ntp_logo.svg"
      type="image/x-icon"
    />
  </head>

  <body class="p-8">
    <!-- Color Picker Modal -->
    <dialog class="modal" id="dlg_clvn" aria-labelledby="dlg_clvn-title">
      <div class="modal-box max-h-[80dvh] max-w-[42rem] flex flex-col items-start overflow-hidden p-0 outline-none motion-reduce:transition-none motion-reduce:animate-none" tabindex="-1" autofocus>
        <header class="border-b border-base-300 flex items-center justify-between w-full p-4">
          <h3 id="dlg_clvn-title" class="text-xl font-semibold">Color Picker</h3>
          <form method="dialog"><button class="btn">
            <svg xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            >
              <path stroke="none" d="M0 0h24v24H0z" />
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button></form>
        </header>
        <section class="overflow-auto w-full p-4">
          <div id="cp_v"></div>
        </section>
        <footer class="modal-action flex items-center justify-center border-t border-base-300 w-full p-4 mt-0">
          <form method="dialog"><button class="btn">Cancel</button></form>
          <button class="btn" id="cp_ok">OK</button>
        </footer>
      </div>
          <form method="dialog" class="modal-backdrop"><button aria-label="Close">close</button></form>
</dialog>

    <!-- Toast -->
    <div class="toast toast-top toast-center" id="nt1" toast-pos="top" popover="manual"></div>
    <div class="card bg-base-200 border border-base-300 shadow-xl w-full max-w-[75rem] h-[min(88vh,54rem)] overflow-hidden">
      <header class="flex items-center justify-between w-full p-4 sticky top-0 z-10 shrink-0 bg-base-100 border-b border-base-300">
        <h3 class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M19.875 6.27a2.225 2.225 0 0 1 1.125 1.948v7.284c0 .809 -.443 1.555 -1.158 1.948l-6.75 4.27a2.269 2.269 0 0 1 -2.184 0l-6.75 -4.27a2.225 2.225 0 0 1 -1.158 -1.948v-7.285c0 -.809 .443 -1.554 1.158 -1.947l6.75 -3.98a2.33 2.33 0 0 1 2.25 0l6.75 3.98h-.033z"
            />
            <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          </svg>
          Settings
        </h3>
        <button class="btn theme-toggle">
          <svg fill="currentColor"
            class="light-icon theme-icon size-6"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
            ></path>
          </svg>
          <svg class="dark-icon theme-icon size-6"
            fill="currentColor"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path fill-rule="evenodd"
              d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
              clip-rule="evenodd"
            ></path>
          </svg>
          Switch Theme
        </button>
      </header>
      <main class="flex flex-col flex-1 w-full max-w-none items-stretch justify-start m-0 p-0 min-h-0 overflow-hidden">
        <!-- #include partials/settings.html -->
      </main>
    </div>
    <!-- Changelog & Support dialogs (triggered from About section) -->
    <!-- #include partials/changelog.html -->
    <!-- #include partials/support_me.html -->

    <script type="module" src="./js/options.js"></script>
  </body>
</html>
